[project]
name = "torchlake"
version = "0.1.2"
description = "implementations of multiple domains of deep learning models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "albumentations>=2.0.8",
  "lmdb>=1.6.2",
  "matplotlib>=3.10.3",
  "numpy>=2.2.6",
  "opencv-contrib-python>=4.11.0.86",
  "opencv-python>=4.11.0.86",
  "polars>=1.31.0",
  "pydantic>=2.11.4",
  "tensorboardx>=2.6.4",
  "tqdm>=4.67.1",
  "torchmetrics>=1.7.1",
  "torchtext",
  "seaborn>=0.13.2",
]


[project.optional-dependencies]
cpu = [
  "torch==2.8.0",
  "torchvision>=0.21.0",
  # "tensorrt",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
]
cu126 = [
  "torch==2.8.0",
  "torchvision>=0.21.0",
  # "tensorrt",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
]
notebook = [
  "av>=14.4.0",
  "datasets>=5.0.1",
  "ipykernel>=6.29.5",
  "ipython>=9.10.0",
  "pandas>=3.0.1",
  "scikit-learn>=1.6.1",
  "torchinfo>=1.8.0",
]
ocr = ["levenshtein>=0.27.1", "trdg>=0.1.1"]
graph = ["networkx>=3.4.2", "torch_geometric>=2.7.0"]
3d = ["trimesh>=4.8.3"]
text = ["tokenizers>=0.21.1"]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=6.1.1",
  "pytest-html>=4.1.1",
  "pytest-sugar>=1.0.0",
  "pytest-xdist>=3.6.1",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torch-scatter = [
  { index = "torch-scatter", extra = "cpu" },
  { index = "torch-scatter-cu126", extra = "cu126" },
]
torch-sparse = [
  { index = "torch-sparse", extra = "cpu" },
  { index = "torch-sparse-cu126", extra = "cu126" },
]
torch-tensorrt = [{ index = "torch-tensorrt-cu126" }]
tensorrt = { path = "F:/TensorRT-10.7.0.23/python/tensorrt-10.7.0-cp311-none-win_amd64.whl" }
torchtext = { path = "torchtext/dist/torchtext-0.0.4-cp311-cp311-win_amd64.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-scatter"
url = "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "torch-sparse"
url = "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "torch-scatter-cu126"
url = "https://data.pyg.org/whl/torch-2.8.0+cu126.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "torch-sparse-cu126"
url = "https://data.pyg.org/whl/torch-2.8.0+cu126.html"
format = "flat"
explicit = true


[[tool.uv.index]]
name = "torch-tensorrt-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["torchlake*"]
